<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Финансовый канал</title>
  <link rel="stylesheet" href="source/styles/finance.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
  <!-- 🔥 Off‑canvas панель -->
  <nav class="sidebar">
    <div class="logo">Меню</div>
    <ul>
      <li><a href="index.html"><i class="fa fa-home"></i>Главная</a></li>
      <li><a href="karmik_table.html" class="active"><i class="fa fa-table"></i>Таблица Кармическая</a></li>
      <li><a href="compatibility.html"><i class="fa fa-heart"></i>Совместимость по Кармической</a></li>
      <li><a href="predict.html"><i class="fa fa-calendar"></i>Прогнозы на год, месяц, день</a></li>
      <li><a href="financial_schedule.html"><i class="fa fa-chart-line"></i>Финансовый график</a></li>
      <li><a href="piphagor.html"><i class="fa fa-square-root-alt"></i>Таблица Пифагора</a></li>
      <li><a href="piph_compat.html"><i class="fa fa-user-friends"></i>Совместимость по Пифагору</a></li>
      <li><a href="finance.html" class="active"><i class="fa fa-coins"></i>Финансовый канал</a></li>
      <li><a href="arcana.html" class="active"><i class="fa fa-star"></i>Арканы</a></li>
    </ul>
  </nav>

  <!-- 🔥 Кнопка-бургер -->
  <button class="burger-btn" onclick="toggleSidebar()">☰</button>

  <div class="container">
    <h2>Финансовый канал</h2>

    <form id="financeForm">
      <label for="birthdate">Введите дату рождения:
        <input type="date" id="birthdate" required />
      </label>
      <button type="submit" id="calculateBtn">Рассчитать</button>
    </form>

    <div id="resultTableContainer"></div>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="modalText">Загрузка...</div>
    </div>
  </div>

  <footer class="container">
    <small><a href="#">Политика конфиденциальности</a> • <a href="#">Условия использования</a></small>
  </footer>

  <script>
    // подсветка активного
    document.addEventListener('DOMContentLoaded', () => {
      const current = window.location.pathname.split('/').pop();
      document.querySelectorAll('.sidebar a').forEach(link => {
        if (link.getAttribute('href') === current) link.classList.add('active');
      });
    });
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
    }
  </script>

  <script src="source/scripts/finance.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Прогноз на день, месяц, год</title>
  <link rel="stylesheet" href="source/styles/predict.css" />
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <button class="nav-toggle" onclick="toggleMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="karmik_table.html">Кармическая матрица</a></li>
        <li><a href="financial_schedule.html">Финансовый график</a></li>
        <li><a href="compatibility.html">Совместимость</a></li>
        <li><a href="predict.html">Прогнозы</a></li>
        <li><a href="piphagor.html">Психоматрица</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <h2>Прогнозы на основе даты рождения</h2>

    <form id="predictForm">
      <label for="birthdate">Дата рождения:
        <input type="date" id="birthdate" required />
      </label>
    </form>

    <section class="section-block">
      <h3>Прогноз на день</h3>
      <label for="predictDay">день, месяц, год:
        <input type="date" id="predictDay" />
      </label>
      <button onclick="predictForDay()">Рассчитать</button>
      <div id="dayResult" class="fadeInUp"></div>
    </section>

    <section class="section-block">
      <h3>Прогноз на месяц</h3>
      <label for="predictMonth">месяц и год:
        <input type="month" id="predictMonth" />
      </label>
      <button onclick="predictForMonth()">Рассчитать</button>
      <div id="monthResult" class="fadeInUp"></div>
    </section>

    <section class="section-block">
      <h3>Прогноз на год</h3>
      <label for="predictYear">год:
        <input type="number" id="predictYear" min="1900" max="2900" placeholder="Например, 2025" />
      </label>
      <button onclick="predictForYear()">Рассчитать</button>
      <div id="yearResult" class="fadeInUp"></div>
    </section>
  </main>

  <footer class="container">
    <small><a href="#">Политика конфиденциальности</a> • <a href="#">Условия использования</a></small>
  </footer>

  <script src="source/scripts/predict.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Прогноз на день, месяц, год</title>
  <link rel="stylesheet" href="source/styles/predict.css" />
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <button class="nav-toggle" onclick="toggleMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="karmik_table.html">Кармическая матрица</a></li>
        <li><a href="financial_schedule.html">Финансовый график</a></li>
        <li><a href="compatibility.html">Совместимость</a></li>
        <li><a href="predict.html">Прогнозы</a></li>
      </ul>
    </div>
  </nav>


  <main class="container">
    <h2>Прогнозы на основе даты рождения</h2>

    <form id="predictForm">
      <label>Дата рождения:
        <input type="date" id="birthdate" required />
      </label>
    </form>

    <section style="margin-top: 40px;">
      <h3>Прогноз на день</h3>
      <label>день, месяц, год:
        <input type="date" id="predictDay" />
      </label>
      <button onclick="predictForDay()">Рассчитать</button>
      <div id="dayResult"></div>
    </section>

    <section style="margin-top: 60px;">
      <h3>Прогноз на месяц</h3>
      <label>месяц и год:
        <input type="month" id="predictMonth" />
      </label>
      <button onclick="predictForMonth()">Рассчитать</button>
      <div id="monthResult"></div>
    </section>

    <section style="margin-top: 60px;">
      <h3>Прогноз на год</h3>
      <label>год:
        <input type="number" id="predictYear" min="2500" max="2900" placeholder="Например, 2025" />
      </label>
      <button onclick="predictForYear()">Рассчитать</button>
      <div id="yearResult"></div>
    </section>
  </main>

  <footer class="container">
    <small>© Твой космический сайт • <a href="index.html">На главную</a></small>
  </footer>

  <script src="source/scripts/predict.js"></script>
</body>

</html>

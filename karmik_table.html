<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Расчёт Кармической Матрицы</title>
  <link rel="stylesheet" href="source/styles/karmik_table.css" />
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <button class="nav-toggle" onclick="toggleMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="karmik_table.html">Кармическая матрица</a></li>
        <li><a href="financial_schedule.html">Финансовый график</a></li>
        <li><a href="compatibility.html">Совместимость</a></li>
        <li><a href="predict.html">Прогнозы</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="grid">
      <section>
        <hgroup>
          <h2>Введите дату рождения</h2>
          <h3>и получите Кармический расчёт</h3>
        </hgroup>

        <!-- Красивая форма -->
        <form id="dateForm" style="margin-bottom: 1rem;">
          <input type="date" id="birthdate" name="birthdate" aria-label="Дата рождения" required />
          <button type="submit" id="calculateButton">Рассчитать</button>
        </form>

        <table id="resultTable">
          <thead>
            <tr>
              <th>Путь</th>
              <th>Число Достижений</th>
              <th>Кармический Узел</th>
              <th>Период</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="container">
    <small><a href="#">Политика конфиденциальности</a> • <a href="#">Условия использования</a></small>
  </footer>

  <script src="source/scripts/karmik_table.js"></script>
</body>

</html>
